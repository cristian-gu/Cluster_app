version: 1
backend:
  phases:
    build:
      commands:
        - npm install --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - echo "Static frontend -- no build step required"
  artifacts:
    baseDirectory: .
    files:
      - index.html
      - register.html
      - signin.html
      - verify.html
      - profile.js
      - cognito-auth.js
      - config.js
      - vendor.js
      - favicon.ico
      - robots.txt
      - amplify_outputs.json
  cache:
    paths:
      - .npm/**/*
