
# Runs on every push/PR. Amplify Hosting deploys the app itself once you
# connect this GitHub repo in the Amplify Console (Hosting -> "Connect
# repository") — that's a separate, automatic build/deploy pipeline. This
# workflow is just a pre-merge sanity check: it doesn't deploy anything or
# need any AWS credentials, so there are no secrets to configure here.
version: 1
backend:
  phases:
    build:
      commands:
        - npm ci
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
