<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify - Profile Card</title>
  <link rel="icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0e0e0e;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .auth-card {
      width: 320px;
      background: #111;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 32px 24px;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      color: #fff; font-size: 20px; margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: #00ddff; }
    input[type="submit"] {
      background: #00ddff;
      color: #000;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      margin-bottom: 0;
    }
    .configMessage {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    }
    .configMessage .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.7); }
    .configMessage .panel {
      position: relative; background: #1a1a1a; border-radius: 16px; padding: 24px; max-width: 320px; color: #fff;
    }
  </style>
</head>
<body>

  <div id="noCognitoMessage" class="configMessage" style="display: none;">
    <div class="backdrop"></div>
    <div class="panel">
      <h3>No Cognito User Pool Configured</h3>
      <p style="margin-top:8px;font-size:13px;color:rgba(255,255,255,0.6);">
        Fill in the pool ID/client ID/region in <a href="config.js" style="color:#00ddff;">config.js</a> after running an Amplify deploy.
      </p>
    </div>
  </div>

  <div class="auth-card">
    <h1>Verify Email</h1>
    <form id="verifyForm">
      <input type="email" id="emailInputVerify" placeholder="Email" required>
      <input type="text" id="codeInputVerify" placeholder="Verification Code" required>
      <input type="submit" value="Verify">
    </form>
  </div>

  <script src="vendor.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
  <script src="config.js"></script>
  <script src="cognito-auth.js"></script>
</body>
</html>
